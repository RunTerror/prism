# Publishes the web app (Components, Playground, Chat) to GitHub Pages on every push to main.
# The Playground compiles in the page, so it works there too. The Chat needs the chat server
# (server/), so on the hosted site it can't reach one.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build core
        working-directory: core
        run: npm ci && npm run build
      - name: Build web
        working-directory: web
        run: npm ci && npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
