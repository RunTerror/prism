name: prism_flutter_demo
description: "Prism demo for Flutter: the Prism examples drawn by the native SDK inside a Flutter app."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  prism_flutter:
    path: ../../flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Examples compiled by poc/core (npm run build): a link to core/dist/examples.json.
    - assets/examples.json
